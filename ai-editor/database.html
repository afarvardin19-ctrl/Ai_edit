<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📊 دیتابیس کاربران</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 14px;
            text-align: center;
        }
        th {
            background: rgba(255, 107, 53, 0.15);
            color: #ff6b35;
            font-weight: 600;
        }
        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .badge {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-refresh {
            background: #ff6b35;
            color: #fff;
            margin-bottom: 20px;
        }
        .btn-refresh:hover {
            transform: scale(1.05);
        }
        .btn-danger {
            background: #ff6b6b;
            color: #fff;
            font-size: 12px;
            padding: 4px 12px;
        }
        .btn-danger:hover {
            background: #ff4444;
        }
        .stats {
            color: rgba(255, 255, 255, 0.3);
            margin: 10px 0;
        }
        .empty {
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            padding: 40px;
        }
        .code-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 4px 10px;
            font-family: monospace;
            color: #ff8c00;
        }
    </style>
</head>
<body>
    <h1>📊 دیتابیس کاربران</h1>
    <button class="btn btn-refresh" onclick="loadUsers()">🔄 بارگذاری مجدد</button>
    <div class="stats" id="stats"></div>
    <div id="userTable"></div>

    <script>
        function loadUsers() {
            fetch('/api/users')
                .then(res => {
                    if (!res.ok) throw new Error('سرور پاسخ نداد');
                    return res.json();
                })
                .then(data => {
                    const stats = document.getElementById('stats');
                    
                    if (!Array.isArray(data) || data.length === 0) {
                        stats.textContent = '👤 هیچ کاربری ثبت نشده';
                        document.getElementById('userTable').innerHTML = '<div class="empty">📭 هنوز کاربری ثبت‌نام نکرده</div>';
                        return;
                    }
                    
                    stats.textContent = `👥 تعداد کاربران: ${data.length}`;
                    
                    let html = '<table>';
                    html += `<tr>
                        <th>#</th>
                        <th>📧 ایمیل</th>
                        <th>🪙 سکه</th>
                        <th>🔗 کد معرف</th>
                        <th>عملیات</th>
                    </tr>`;
                    
                    data.forEach((user, index) => {
                        html += `<tr>
                            <td>${index + 1}</td>
                            <td><span class="code-box">${user.email || '---'}</span></td>
                            <td><span class="badge">${user.coins || 10} 🪙</span></td>
                            <td><span class="code-box">${user.referralCode || '---'}</span></td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteUser('${user.email}')">🗑️</button>
                            </td>
                        </tr>`;
                    });
                    
                    html += '</table>';
                    document.getElementById('userTable').innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('stats').textContent = '❌ خطا: ' + err.message;
                    document.getElementById('userTable').innerHTML = '<div class="empty">⚠️ خطا در ارتباط با سرور</div>';
                });
        }

        function deleteUser(email) {
            if (confirm(`🗑️ کاربر "${email}" رو حذف کنم؟`)) {
                fetch(`/api/user/${email}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(data => {
                        alert(data.message || '✅ حذف شد');
                        loadUsers();
                    })
                    .catch(err => alert('❌ خطا: ' + err.message));
            }
        }

        loadUsers();
    </script>
</body>
</html>
