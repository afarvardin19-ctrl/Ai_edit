<!DOCTYPE html>
<html>
<head><title>Users</title></head>
<body>
<h1>Users List</h1>
<button onclick="load()">Load</button>
<pre id="out"></pre>
<script>
function load(){
 fetch('/api/users')
 .then(r=>r.json())
 .then(d=>document.getElementById('out').textContent=JSON.stringify(d,null,2))
}
</script>
</body>
</html>
