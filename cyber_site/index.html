<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام دانش‌آموزی - سایبرلب</title>
</head>
<body>
    <h1>سایبرلب</h1>
    <h2>فرم ثبت‌نام دانش‌آموزی</h2>
    
    <form id="registerForm">
        <div>
            <label>نام:</label><br>
            <input type="text" id="name" placeholder="نام خود را وارد کنید" required>
        </div>
        <br>
        
        <div>
            <label>نام خانوادگی:</label><br>
            <input type="text" id="family" placeholder="نام خانوادگی خود را وارد کنید" required>
        </div>
        <br>
        
        <div>
            <label>شماره تماس:</label><br>
            <input type="tel" id="phone" placeholder="09xxxxxxxxx" required>
        </div>
        <br>
        
        <div>
            <label>ایمیل:</label><br>
            <input type="email" id="email" placeholder="example@gmail.com" required>
        </div>
        <br>
        
        <div>
            <label>رمز عبور:</label><br>
            <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید" required>
        </div>
        <br>
        
        <div>
            <label>کد ورودی:</label><br>
            <input type="text" id="code" placeholder="کد 6 رقمی را وارد کنید" maxlength="6" required>
            <br>
            <button type="button" onclick="sendCode()">ارسال کد ورودی</button>
            <span id="status" style="color: blue;"></span>
        </div>
        <br>
        
        <button type="submit">ثبت‌نام</button>
    </form>

    <div id="result"></div>

    <script>
        let savedCode = '';

        function sendCode() {
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            
            if (!phone && !email) {
                document.getElementById('status').innerHTML = '❌ لطفاً شماره تماس یا ایمیل را وارد کنید!';
                document.getElementById('status').style.color = 'red';
                return;
            }

            savedCode = Math.floor(100000 + Math.random() * 900000).toString();
            
            document.getElementById('status').innerHTML = '✅ کد ورودی به شماره/ایمیل شما ارسال شد!';
            document.getElementById('status').style.color = 'green';
            
            console.log('کد ارسال شده (برای تست):', savedCode);
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const family = document.getElementById('family').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const code = document.getElementById('code').value;

            if (!savedCode) {
                document.getElementById('result').innerHTML = `
                    <div style="color: red; border: 2px solid red; padding: 10px; margin-top: 20px;">
                        ❌ ابتدا دکمه "ارسال کد ورودی" را بزنید!
                    </div>
                `;
                return;
            }

            if (code === savedCode) {
                document.getElementById('result').innerHTML = `
                    <div style="color: green; border: 2px solid green; padding: 10px; margin-top: 20px;">
                        <h3>✅ ثبت‌نام موفق!</h3>
                        <p><strong>نام:</strong> ${name}</p>
                        <p><strong>نام خانوادگی:</strong> ${family}</p>
                        <p><strong>شماره تماس:</strong> ${phone}</p>
                        <p><strong>ایمیل:</strong> ${email}</p>
                    </div>
                `;
                savedCode = '';
                document.getElementById('status').innerHTML = '';
            } else {
                document.getElementById('result').innerHTML = `
                    <div style="color: red; border: 2px solid red; padding: 10px; margin-top: 20px;">
                        ❌ کد ورودی اشتباه است! لطفاً کد صحیح را وارد کنید.
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
