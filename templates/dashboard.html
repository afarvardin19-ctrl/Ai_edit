<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><body><main class="wrap"><div class="top"><h1>⚽ پنل فوتبال زنجان</h1><a href="/logout">خروج</a></div><form class="filters"><input name="q" value="{{q}}" placeholder="جست‌وجو نام، کد ملی یا کد ثبت‌نام"><button>🔍</button></form><div class="table"><table><tr><th>کد</th><th>نام</th><th>تماس</th><th>محل</th><th>امتیاز</th><th>عملیات</th></tr>{% for s in students %}<tr><td>{{s.code}}</td><td>{{s.first_name}} {{s.last_name}}</td><td>{{s.phone}}</td><td>{{s.province}} / {{s.county}}</td><td>{{s.points}}</td><td><a href="/admin/student/{{s.id}}/edit">✏️ ویرایش</a> <form class="inline" method="post" action="/admin/student/{{s.id}}/delete"><button class="danger">🗑️</button></form></td></tr>{% endfor %}</table></div></main></body></html>
