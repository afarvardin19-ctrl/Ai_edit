<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>فوتبال زنجان</title><body><main class="wrap"><div class="logo">⚽ فوتبال زنجان</div><h1>ثبت‌نام بازیکن</h1><form method="post" enctype="multipart/form-data" class="card grid">
<label>نام<input name="first_name" required></label><label>نام خانوادگی<input name="last_name" required></label><label>نام پدر<input name="father_name" required></label><label>کد ملی<input name="national_id" required></label><label>شماره تماس<input name="phone" required></label><label>سن<input type="number" name="age" required></label><label>تاریخ تولد<input type="date" name="birth_date" required></label>
<label>استان<select name="province" required><option value="">انتخاب</option>{% for p in ["آذربایجان شرقی","آذربایجان غربی","اردبیل","اصفهان","البرز","ایلام","بوشهر","تهران","چهارمحال و بختیاری","خراسان جنوبی","خراسان رضوی","خراسان شمالی","خوزستان","زنجان","سمنان","سیستان و بلوچستان","فارس","قزوین","قم","کردستان","کرمان","کرمانشاه","کهگیلویه و بویراحمد","گلستان","گیلان","لرستان","مازندران","مرکزی","هرمزگان","همدان","یزد"] %}<option>{{p}}</option>{% endfor %}</select></label>
<label>شهرستان<input name="county" required></label><label class="full">آدرس<textarea name="address" required></textarea></label><label class="full">تجربه در فوتبال<textarea name="football_experience"></textarea></label>
<label>رشته تحصیلی<input name="education"></label><label>مدرسه<input name="school"></label><label>شماره تماس پدر<input name="father_phone"></label><label>شماره تماس منزل<input name="home_phone"></label>
<label>عکس<input type="file" name="photo" accept="image/*"></label><label>کپی شناسنامه<input type="file" name="id_document" accept="image/*,.pdf"></label><label>کد معرف<input name="referral" value="{{referral}}"></label>
<div class="full"><button>ثبت‌نام</button></div></form></main></body></html>
