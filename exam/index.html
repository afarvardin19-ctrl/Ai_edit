<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Tahoma;background:#f0f2f5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
        .container{max-width:450px;width:100%;background:#fff;border-radius:16px;padding:35px 30px;box-shadow:0 8px 40px rgba(0,0,0,0.08);}
        h1{text-align:center;color:#1a1a2e;border-bottom:3px solid #4a6cf7;padding-bottom:12px;margin-bottom:25px;}
        .form-group{margin-bottom:15px;}
        label{display:block;color:#374151;font-size:13px;font-weight:600;margin-bottom:5px;}
        input{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:15px;background:#fafbfc;}
        input:focus{outline:none;border-color:#4a6cf7;box-shadow:0 0 0 4px rgba(74,108,247,0.1);}
        .btn{width:100%;padding:13px;background:#4a6cf7;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;}
        .btn:hover{background:#3b5de7;transform:translateY(-1px);box-shadow:0 4px 16px rgba(74,108,247,0.3);}
        .message{margin-top:15px;padding:12px 16px;border-radius:10px;font-size:14px;display:none;}
        .message.success{background:#ecfdf5;color:#065f46;display:block;border:1px solid #a7f3d0;}
        .message.error{background:#fef2f2;color:#991b1b;display:block;border:1px solid #fca5a5;}
        .footer{text-align:center;font-size:12px;color:#9ca3af;margin-top:16px;}
        .db-link{display:block;text-align:center;margin-top:10px;color:#4a6cf7;text-decoration:none;font-size:14px;}
        .db-link:hover{text-decoration:underline;}
    </style>
</head>
<body>
<div class="container">
    <h1>📝 ثبت نام</h1>
    <form id="registerForm">
        <div class="form-group">
            <label>نام</label>
            <input type="text" id="name" placeholder="نام" required>
        </div>
        <div class="form-group">
            <label>نام خانوادگی</label>
            <input type="text" id="family" placeholder="نام خانوادگی" required>
        </div>
        <div class="form-group">
            <label>کد ملی</label>
            <input type="text" id="nationalCode" placeholder="کد ملی" required>
        </div>
        <div class="form-group">
            <label>شماره تماس</label>
            <input type="tel" id="phone" placeholder="شماره تماس" required>
        </div>
        <div class="form-group">
            <label>ایمیل</label>
            <input type="email" id="email" placeholder="ایمیل" required>
        </div>
        <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" id="password" placeholder="رمز عبور" required>
        </div>
        <button type="submit" class="btn">ثبت نام</button>
    </form>
    <div id="message" class="message"></div>
    <a href="/database" class="db-link">📊 مشاهده دیتابیس</a>
    <div class="footer">کلیه حقوق محفوظ است © ۱۴۰۴</div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const data = {
            name: document.getElementById('name').value,
            family: document.getElementById('family').value,
            nationalCode: document.getElementById('nationalCode').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        const msg = document.getElementById('message');
        
        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await response.json();
            
            if (result.message.includes('موفق')) {
                msg.className = 'message success';
                msg.textContent = '✅ ' + result.message;
                document.getElementById('registerForm').reset();
            } else {
                msg.className = 'message error';
                msg.textContent = '❌ ' + result.message;
            }
        } catch (error) {
            msg.className = 'message error';
            msg.textContent = '❌ خطا در ارتباط با سرور';
        }
    });
</script>
</body>
</html>
